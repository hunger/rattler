[package]
description = "Detect virtual packages using channel-provided detection plugins"
edition.workspace = true
license.workspace = true
name = "rattler_virtual_package_plugins"
repository.workspace = true
version = "0.1.0"

[features]
experimental-virtual-package-plugins = [
  "rattler_conda_types/experimental-virtual-package-plugins",
  "dep:rattler_shell",
  "dep:tokio",
  "dep:tracing",
]

[dependencies]
rattler_conda_types = { workspace = true }
rattler_shell = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "time",
], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
